version: 2

project_name: ffbatch

builds:
  - id: ffbatch
    main: .
    binary: ffbatch
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/Bilalmesk/ffmpeg-batch-convert/internal/version.Version={{ .Version }}
      - -X github.com/Bilalmesk/ffmpeg-batch-convert/internal/version.Commit={{ .Commit }}
      - -X github.com/Bilalmesk/ffmpeg-batch-convert/internal/version.Date={{ .Date }}

archives:
  - formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - CONTRIBUTING.md
      - ffbatch.example.json
      - docs/*

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

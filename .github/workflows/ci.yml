name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

  integration:
    name: ffmpeg smoke (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Convert a generated clip
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=size=320x240:rate=25" \
            -f lavfi -i "sine=frequency=440" \
            -t 2 -c:v libx264 -preset ultrafast -c:a aac "$work/in.ts"
          go build -o "$work/ffbatch" .
          "$work/ffbatch" convert "$work/in.ts" --output "$work/out" --quiet
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 "$work/out/in.mp4" | grep -qx video
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 "$work/out/in.mp4" | grep -qx audio
          mkdir -p "$work/gobin"
          GOBIN="$work/gobin" go install ./cmd/ffbatch
          "$work/gobin/ffbatch" version | grep -q "^ffbatch "